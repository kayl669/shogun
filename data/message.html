<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
    <section class="card center"><h1>{{TITLE}}</h1>
        <p>{{MESSAGE}}</p>
        <div id="count" class="temp-value">{{COUNT}}</div>
        <p class="muted">Please wait…</p></section>
</main>
<script>let n = {{COUNT}};
if (n > 0) {
    setInterval(() => {
        n--;
        document.getElementById('count').textContent = n;
        if (n <= 0) location.href = '/';
    }, 1000)
}</script>
</body>
</html>
